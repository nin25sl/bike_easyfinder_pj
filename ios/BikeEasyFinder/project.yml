name: BikeEasyFinder

options:
  bundleIdPrefix: com.bikeeasyfinder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  BikeEasyFinder:
    type: application
    platform: iOS
    sources:
      - path: BikeEasyFinder
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bikeeasyfinder.app
        PRODUCT_NAME: BikeEasyFinder
        INFOPLIST_FILE: BikeEasyFinder/Resources/Info.plist
        BIKE_API_BASE_URL: "http://127.0.0.1:8000"
        CODE_SIGN_ENTITLEMENTS: BikeEasyFinder/BikeEasyFinder.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets:
        - BikeEasyFinderTests

  BikeEasyFinderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BikeEasyFinderTests
    dependencies:
      - target: BikeEasyFinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bikeeasyfinder.app.tests
        GENERATE_INFOPLIST_FILE: true
