services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bike_easyfinder}
      POSTGRES_USER: ${POSTGRES_USER:-bike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bike_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bike} -d ${POSTGRES_DB:-bike_easyfinder}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - spot_data_pg:/var/lib/postgresql/data

  migrate:
    build:
      context: ./data_collection
    environment: &worker_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bike}:${POSTGRES_PASSWORD:-bike_local_only}@db:5432/${POSTGRES_DB:-bike_easyfinder}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COLLECTION_CONFIG: /app/config/sources.yaml
      OUTPUT_DIR: /app/output
      CACHE_DIR: /app/cache
      MEDIA_ENDPOINT_URL: http://minio:9000
      MEDIA_ACCESS_KEY: ${MEDIA_ACCESS_KEY:-bike_media}
      MEDIA_SECRET_KEY: ${MEDIA_SECRET_KEY:-bike_media_local_only}
    command: ["python", "-m", "collection_worker", "db", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data_collection/config:/app/config:ro
      - ./data_collection/output:/app/output

  worker:
    build:
      context: ./data_collection
    environment: *worker_environment
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./data_collection/config:/app/config:ro
      - ./data_collection/seeds:/app/seeds:ro
      - ./data_collection/output:/app/output
      - ./data_collection/cache:/app/cache

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MEDIA_ACCESS_KEY:-bike_media}
      MINIO_ROOT_PASSWORD: ${MEDIA_SECRET_KEY:-bike_media_local_only}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - spot_media_objects:/data

  api-migrate:
    build:
      context: ./backend
      target: runtime
    environment: &api_environment
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bike}:${POSTGRES_PASSWORD:-bike_local_only}@db:5432/${POSTGRES_DB:-bike_easyfinder}
      ROUTE_PROVIDER: ${ROUTE_PROVIDER:-approximate}
      APPLE_MAPS_ACCESS_TOKEN: ${APPLE_MAPS_ACCESS_TOKEN:-}
      RECOMMENDATION_RULE_VERSION: ${RECOMMENDATION_RULE_VERSION:-mvp-1.2}
      DATA_VERSION: ${DATA_VERSION:-canonical-local}
    command: ["bike-api", "migrate"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ./backend
      target: runtime
    environment: *api_environment
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  api-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://unused
      OPENAPI_CONTRACT_PATH: /workspace/docs/bike_easyfinder_pj/SystemDesign/mvp-openapi-v1.yaml
    volumes:
      - ./docs:/workspace/docs:ro

volumes:
  spot_data_pg:
  spot_media_objects:
